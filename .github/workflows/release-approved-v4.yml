name: Release approved SpellScript V4
on:
  push:
    paths:
      - .github/workflows/release-approved-v4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SpellScript
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Download, verify, test and install approved SpellScript V4
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp /tmp/spellscript-v4.XXXXXX.zip)"
          extracted="$(mktemp -d)"
          curl -fLsS --retry 3 --max-time 160 "https://d2ol7oe51mr4n9.cloudfront.net/user_3MIEPFthco9dY9cM3oHkRBr7N1I/62fea724-a068-492b-8555-1bb3476e5e84.zip" -o "$archive"
          echo "a179e118b52fd0491171e6d88456665772f7b12bf6a89a9d48af2ccbd0928c75  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$extracted"
          src="$extracted/SpellScript_V4"
          for path in index.html css/styles.css js/data.js js/afd.js js/game.js js/app.js js/music.js js/writingRules.js js/educationalAFD.js js/writingAnalyzer.js js/learningProgress.js js/adaptiveTutor.js js/practice.js js/afdTutor.js js/afdVisualizer.js assets/torreon_arcano.webp assets/puerta_helada.webp assets/guardian_fuego.webp assets/camara_niebla.webp pruebas/test_motor.cjs pruebas/test_v3.cjs pruebas/test_v4.cjs; do
            test -s "$src/$path"
          done
          cd "$src"
          node pruebas/test_motor.cjs
          node pruebas/test_v3.cjs
          node pruebas/test_v4.cjs
          cd "$GITHUB_WORKSPACE"
          git ls-files -z | xargs -0 -r git rm -r -q --ignore-unmatch --
          cp -a "$src/." .
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Release SpellScript V4: educational AFD, writing tutor and exercises"
            git push origin HEAD:main
          fi
