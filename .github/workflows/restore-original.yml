name: Restore SpellScript first version
on:
  push:
    paths:
      - .github/workflows/restore-original.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified original ZIP and restore exact project files
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp /tmp/spellscript-original.XXXXXX.zip)"
          restore_dir="$(mktemp -d)"
          curl -fL --retry 3 --max-time 180 \
            "https://d2ol7oe51mr4n9.cloudfront.net/user_3MIEPFthco9dY9cM3oHkRBr7N1I/feea5d1d-6698-4e20-b455-70476d2f9949.zip" \
            -o "$archive"
          echo "d45f2aa18923245d0751b486ffd1b9befa0d82639ab9937344715c28519c310e  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$restore_dir"
          test -s "$restore_dir/SpellScript_Primer_Avance/index.html"
          test -s "$restore_dir/SpellScript_Primer_Avance/assets/torreon_arcano.webp"
          test -s "$restore_dir/SpellScript_Primer_Avance/assets/puerta_helada.webp"
          # The original release uses WebP, not the substitute SVG backgrounds.
          git rm -r -f --ignore-unmatch assets/torreon_arcano.svg assets/puerta_helada.svg docs tests
          cp -a "$restore_dir/SpellScript_Primer_Avance/." .
          # Ensure the original visual assets survive unchanged.
          test "$(sha256sum assets/torreon_arcano.webp | cut -d' ' -f1)" = "$(sha256sum "$restore_dir/SpellScript_Primer_Avance/assets/torreon_arcano.webp" | cut -d' ' -f1)"
          test "$(sha256sum assets/puerta_helada.webp | cut -d' ' -f1)" = "$(sha256sum "$restore_dir/SpellScript_Primer_Avance/assets/puerta_helada.webp" | cut -d' ' -f1)"
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Restore original SpellScript visuals and code from first ZIP"
            git push origin HEAD:main
          fi
