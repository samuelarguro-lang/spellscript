name: Publish approved SpellScript V3 ZIP
on:
  push:
    paths:
      - .github/workflows/publish-approved-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Verify and restore approved V3 archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp /tmp/spellscript-v3.XXXXXX.zip)"
          extract_dir="$(mktemp -d)"
          curl -fsSL --retry 3 --max-time 180 "https://d2ol7oe51mr4n9.cloudfront.net/user_3MIEPFthco9dY9cM3oHkRBr7N1I/2f9ed0ea-ec1f-438f-b6b8-a32dd401c489.zip" -o "$archive"
          echo "832e8ffd5e8290927cb67e4b87b39e100dfa432d64c9606d6ea88a65ee6e652c  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$extract_dir"
          src="$extract_dir/SpellScript_V3"
          for path in index.html css/styles.css js/data.js js/afd.js js/game.js js/app.js js/music.js assets/torreon_arcano.webp assets/puerta_helada.webp assets/guardian_fuego.webp assets/camara_niebla.webp pruebas/test_motor.cjs pruebas/test_v3.cjs; do
            test -s "$src/$path"
          done
          # Replace the previous version, avoiding a mix of V2 and V3 files.
          git ls-files -z | xargs -0 -r git rm -r -q --ignore-unmatch --
          cp -a "$src/." .
          git add -A
          node pruebas/test_motor.cjs
          node pruebas/test_v3.cjs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Release approved SpellScript V3 with varied riddles, AFD history and portal effects"
            git push origin HEAD:main
          fi
