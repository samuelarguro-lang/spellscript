name: Publish approved SpellScript V2 ZIP
on:
  push:
    paths:
      - .github/workflows/publish-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SpellScript
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and restore the approved version 2 archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp /tmp/spellscript-v2.XXXXXX.zip)"
          extract_dir="$(mktemp -d)"
          curl -fsSL --retry 3 --max-time 120 "https://d2ol7oe51mr4n9.cloudfront.net/user_3MIEPFthco9dY9cM3oHkRBr7N1I/ef519ad6-7c9a-4b03-a1f7-298a67c5cc9f.zip" -o "$archive"
          echo "cfcdcf7e56a9b62438ae9409225d82ed111154f11d6353e645ecf5247cefe3d0  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$extract_dir"
          src="$extract_dir/SpellScript_V2"
          for path in index.html css/styles.css js/data.js js/afd.js js/game.js js/app.js js/music.js assets/torreon_arcano.webp assets/puerta_helada.webp assets/guardian_fuego.webp assets/camara_niebla.webp pruebas/test_motor.cjs; do
            test -s "$src/$path"
          done
          # Replace the previous source files rather than mixing V1 and V2.
          git ls-files -z | xargs -0 -r git rm -r -q --ignore-unmatch --
          cp -a "$src/." .
          git add -A
          node pruebas/test_motor.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release SpellScript V2: tutorial, difficulty, all three rooms, music and casting effects"
          git push origin HEAD:main
